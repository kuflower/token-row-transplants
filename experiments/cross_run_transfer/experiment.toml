[study]
name = "cross_run_transfer"
seeds = [90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101]
inference_unit = "seed"

[model]
token_count = 16384
context_length = 256
width = 384
layers = 8
attention_heads = 6
active_parameters = 20586240
tied_token_matrix = true

[training]
source_runs_per_language = 2
parent_updates = 6100
english_continuation_updates = 6100
batch_size = 64
learning_rate = 0.0003
minimum_learning_rate = 0.00003
warmup_updates = 200
weight_decay = 0.01

[comparison]
installed_row_sources = [
  "initial",
  "co_trained",
  "same_language_other_run",
  "other_language",
]
spelling_axes = ["spanish", "german"]
equivalence_range = 0.05

[measurement]
checkpoints = [0, 50, 100, 200, 400, 800, 1500, 3000, 6000, 6100]
minimum_contexts_per_word = 5
