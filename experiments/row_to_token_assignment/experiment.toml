[study]
name = "row_to_token_assignment"
seeds = [90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101]
inference_unit = "seed"

[model]
token_count = 16384
context_length = 256
width = 384
layers = 8
attention_heads = 6
active_parameters = 20586240
tied_token_matrix = true

[training]
parent_updates = 6100
english_continuation_updates = 6100
batch_size = 64

[comparison]
installed_row_sources = [
  "initial",
  "correct_assignment",
  "reassignment_1",
  "reassignment_2",
  "reassignment_3",
]
spelling_axes = ["spanish", "german"]
remaining_effect_equivalence_range = 0.10

[reassignment]
method = "frequency_local_derangement"
maximum_frequency_block_size = 33
draw_seeds = [19301, 19302, 19303]

[measurement]
checkpoints = [0, 50, 100, 200, 400, 800, 1500, 3000, 6000, 6100]
minimum_contexts_per_word = 5
