name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-lock.txt
      - name: Install
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Verify environment
        run: make environment-check
      - name: Check
        run: make check
      - name: Smoke-test notebook extra in a clean environment
        run: |
          notebook_environment="${RUNNER_TEMP}/token-row-transplants-notebook"
          notebook_output="${RUNNER_TEMP}/token-row-transplants-notebook-output"
          python -m venv "${notebook_environment}"
          "${notebook_environment}/bin/python" -m pip install -e '.[notebook]'
          mkdir -p "${notebook_output}"
          "${notebook_environment}/bin/python" -m nbconvert \
            --to notebook --execute --ExecutePreprocessor.timeout=120 \
            --output-dir "${notebook_output}" \
            notebooks/results_overview.ipynb
      - name: Build distributions
        run: python -m build
      - name: Smoke-test wheel in a clean environment
        run: |
          wheel_environment="${RUNNER_TEMP}/token-row-transplants-wheel"
          python -m venv "${wheel_environment}"
          "${wheel_environment}/bin/python" -m pip install dist/*.whl
          "${wheel_environment}/bin/python" -m pip check
          "${wheel_environment}/bin/python" -c "import token_row_transplants"
      - name: Smoke-test source distribution in a clean environment
        run: |
          sdist_environment="${RUNNER_TEMP}/token-row-transplants-sdist"
          python -m venv "${sdist_environment}"
          "${sdist_environment}/bin/python" -m pip install dist/*.tar.gz
          "${sdist_environment}/bin/python" -m pip check
          "${sdist_environment}/bin/python" -c "import token_row_transplants"
